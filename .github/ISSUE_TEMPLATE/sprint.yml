name: Sprint review
description: Record the demo, feedback, carry-over and one improvement.
title: "[Sprint review] "
body:
  - type: textarea
    id: demo
    attributes:
      label: Outcome and demo
      description: Link the milestone and evidence for the sprint goal.
    validations:
      required: true
  - type: textarea
    id: followup
    attributes:
      label: Feedback and carry-over
      description: Link follow-up issues and record the next decision for unfinished work.
  - type: textarea
    id: retro
    attributes:
      label: Next sprint improvement
      description: Choose one change to how the team works and who will try it.
