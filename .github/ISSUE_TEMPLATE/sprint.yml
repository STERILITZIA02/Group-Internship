name: Sprint review
description: Capture the demo and next actions.
body:
  - type: textarea
    id: demo
    attributes:
      label: Demo
      placeholder: Link the milestone and what the team demonstrated.
    validations:
      required: true
  - type: textarea
    id: followup
    attributes:
      label: Next actions
      placeholder: Carry-over, feedback or one improvement to try.
