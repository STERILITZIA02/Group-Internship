name: Bug report
description: Report a reproducible problem.
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      placeholder: Device, steps or sample deck.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      placeholder: What happened? What did you expect? Attach a screenshot or log ID if useful.
    validations:
      required: true
