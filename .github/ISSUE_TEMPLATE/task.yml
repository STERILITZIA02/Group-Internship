name: Project task
description: Define a deliverable and its acceptance check.
title: "[Task] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should someone be able to do when this ships?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance check
      description: Give the steps and observable result.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Implementation context
      description: Link starting files, dependencies or decisions that affect the work.
