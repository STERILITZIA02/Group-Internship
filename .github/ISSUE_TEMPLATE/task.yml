name: Project task
description: Describe the change and how to check it.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      placeholder: What should the user or developer be able to do?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Quick check
      placeholder: One action and its expected result.
    validations:
      required: true
