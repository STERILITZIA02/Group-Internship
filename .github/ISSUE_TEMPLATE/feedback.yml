name: User feedback
description: Capture a user observation or suggestion.
labels: [user-feedback]
body:
  - type: textarea
    id: observation
    attributes:
      label: Observation
      placeholder: What was the person trying to do, and what happened?
    validations:
      required: true
  - type: textarea
    id: retest
    attributes:
      label: Follow-up
      placeholder: A possible improvement, retest, screenshot or session note.
